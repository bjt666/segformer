# Native/2x inputs, ONE shared B0; ordinary residual fusion at F2/F3.
data_root: dataset
output_dir: null
epochs: 100
batch_size: 8
num_workers: 4
seed: 42
device: cuda
pretrained: true
pretrained_model: nvidia/mit-b0
input_channels: [3, 2, 1]
input_bands: [NIR, R, G]
input_scale: 2.0
shared_scale: plain
shared_scale_stages: [2, 3]
shared_scale_width: 32
encoder_lr: 0.00006
decoder_lr: 0.0006
weight_decay: 0.01
loss: cross_entropy_lovasz
lovasz_weight: 0.1
log_every: 20
visualization_samples: 8
module_a: false
module_b: false
encoder_discrimination: false
encoder_unravel: false
error_refinement: false
dual_encoder: false
spectral_refinement: "off"
decoder_fusion: progressive
decoder_upsampling: learned
upsample_channels: [64, 32]
freqfusion: true
freqfusion_compressed_channels: 64
freqfusion_lowpass_kernel: 5
freqfusion_highpass_kernel: 3
freqfusion_resample_groups: 4
freqfusion_checkpoint: true
freqfusion_chunk_size: 32
