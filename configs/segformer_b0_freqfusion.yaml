# TIFF source order: Blue, Green, Red, NIR (zero-based indices below).
# Original SegFormer MLP decoder + FreqFusion; previous A/B and decoder changes OFF.
data_root: dataset
output_dir: null  # A timestamped experiment directory is created automatically.
epochs: 100
batch_size: 8
num_workers: 4
seed: 42
device: cuda
pretrained: true
pretrained_model: nvidia/mit-b0
input_channels: [3, 2, 1]
input_bands: [NIR, R, G]
encoder_lr: 0.00006
decoder_lr: 0.0006
weight_decay: 0.01
loss: cross_entropy
log_every: 20
visualization_samples: 8

# Retain old settings for reproducibility; no A/B refinement in this experiment.
module_a: false
module_b: false
local_kernels: [3, 5, 7]
refinement_stages: [1, 2]
gate_mode: deep_shallow
gate_reduction: 4
gate_init_probability: 0.3333333333333333
residual_init_std: 0.001

# Disable the previously redesigned decoder.
decoder_fusion: mlp
decoder_upsampling: bilinear
upsample_channels: [64, 32]  # Inactive with bilinear logit resizing.

# Independent FreqFusion switch and memory controls.
freqfusion: true
freqfusion_compressed_channels: 64
freqfusion_lowpass_kernel: 5
freqfusion_highpass_kernel: 3
freqfusion_resample_groups: 4
freqfusion_checkpoint: true
freqfusion_chunk_size: 32
