# Independent encoder ablation: original MLP decoder + one F2 adapter.
data_root: dataset
output_dir: null
epochs: 100
batch_size: 8
num_workers: 4
seed: 42
device: cuda
pretrained: true
pretrained_model: nvidia/mit-b0
input_channels: [3, 2, 1]
input_bands: [NIR, R, G]
encoder_lr: 0.00006
decoder_lr: 0.0006
weight_decay: 0.01
loss: cross_entropy_lovasz
lovasz_weight: 0.1
log_every: 20
visualization_samples: 8
module_a: false
module_b: false
encoder_discrimination: false
dual_encoder: false
spectral_refinement: "off"
encoder_unravel: true
unravel_channels: 128
unravel_kernel: 7
unravel_quality_channels: 64
unravel_residual_scale: 0.1
decoder_fusion: mlp
decoder_upsampling: bilinear
freqfusion: false
